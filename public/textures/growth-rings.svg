<svg xmlns="http://www.w3.org/2000/svg" width="620" height="620" viewBox="0 0 620 620" fill="none">
  <!-- Tree-ring cross section. Rings drift off-centre and vary in weight so the
       motif reads as grown rather than drawn. Stroked in white; opacity is
       controlled by the .rings utility in globals.css. -->
  <g stroke="#ffffff" stroke-width="1.15" opacity="0.9">
    <ellipse cx="316" cy="304" rx="14"  ry="13"/>
    <ellipse cx="314" cy="306" rx="27"  ry="25" stroke-width="0.8"/>
    <ellipse cx="317" cy="303" rx="43"  ry="41"/>
    <ellipse cx="312" cy="307" rx="61"  ry="56" stroke-width="0.7"/>
    <ellipse cx="316" cy="302" rx="79"  ry="75"/>
    <ellipse cx="311" cy="308" rx="99"  ry="91" stroke-width="1.5"/>
    <ellipse cx="315" cy="304" rx="121" ry="114" stroke-width="0.7"/>
    <ellipse cx="309" cy="309" rx="144" ry="132"/>
    <ellipse cx="314" cy="303" rx="168" ry="159" stroke-width="0.8"/>
    <ellipse cx="308" cy="310" rx="193" ry="178" stroke-width="1.4"/>
    <ellipse cx="313" cy="304" rx="219" ry="207" stroke-width="0.7"/>
    <ellipse cx="307" cy="311" rx="246" ry="228"/>
    <ellipse cx="312" cy="305" rx="274" ry="259" stroke-width="0.8"/>
    <ellipse cx="306" cy="312" rx="301" ry="280" stroke-width="1.3"/>
  </g>

  <!-- A single radial check, the split that runs outward from the heartwood. -->
  <path d="M322 296 C 372 250, 430 196, 486 148" stroke="#ffffff" stroke-width="1.1" opacity="0.55" stroke-linecap="round"/>
  <path d="M304 316 C 258 366, 206 420, 150 470" stroke="#ffffff" stroke-width="0.9" opacity="0.4" stroke-linecap="round"/>
</svg>
